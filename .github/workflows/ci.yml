name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This is a PUBLIC repo. Any hit here is a release blocker, not a style
      # nit. Scan excludes .git, node_modules, and this workflow file itself.
      #
      # THE PRIVATE TERM LIST IS NOT WRITTEN HERE, IN ANY ENCODING. It arrives
      # at runtime from the organisation secret DOCS_DENY_PATTERN, mirroring the
      # canonical list in the private umbrella repository. This step used to
      # inline the list with every term split by a single-character bracket
      # class; that defeats grep but not a reader, so the gate against
      # disclosure was itself the disclosure. Do not reintroduce it — not
      # verbatim, not bracket-split, not obfuscated any other way. The
      # --exclude-dir=.github below is defense in depth on top of sourcing, not
      # a substitute for it. Same model as docs-bar.yml, which is byte-identical
      # across the family. Keep in sync with the sibling library repo's gate.
      - name: Genericize grep gate (banned internal terms)
        env:
          DENY: ${{ secrets.DOCS_DENY_PATTERN }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Fork PRs cannot read organisation secrets. Skipping is the same call
          # docs-bar.yml makes: maintainer review covers a fork's diff.
          if [ "$EVENT" = pull_request ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::notice::genericize gate skipped on fork PRs — secret unavailable; maintainer review covers this"
            exit 0
          fi

          # FAIL CLOSED — and test DENY *on its own*, never the combined pattern
          # built below. EXTRAS is a non-empty literal, so an unset secret would
          # still leave a non-empty FULL: the job would go green having checked
          # only the handful of local terms. That is the single most dangerous
          # failure mode of sourcing the list; this is the guard against it.
          if [ -z "${DENY:-}" ]; then
            echo "::error::DOCS_DENY_PATTERN is unset or empty — failing closed"
            exit 1
          fi

          # Repo-local extras, safe to spell out and deliberately NOT in the
          # shared secret: the sibling PRODUCT names are public (or going
          # public), and an in-image install path plus a loopback port range
          # disclose nothing. They are banned here only because this repository
          # must not carry internal demo strings — a different concern from the
          # family-wide private-name list. NOTE the one product name that is
          # absent on purpose: the retired product's repo is private, so its
          # name lives in the secret half with the other private names.
          EXTRAS='mythical-skuld|mythical-saga|mythical-brokkr|/opt/mythical|127\.0\.0\.1:7[0-9]{3}'
          FULL="${DENY}|${EXTRAS}"

          # Self-test A — the SECRET half alone. The probe is assembled from
          # fragments at runtime so no banned term is written in this file. It
          # proves the secret arrived, is a usable ERE, and actually fires. It
          # does NOT prove the list is COMPLETE: completeness is guaranteed by
          # the umbrella repository being canonical, not by this check.
          p1=de-; p2=net
          printf '%s\n' "$p1$p2" | grep -aiqE -e "$DENY" && rc=0 || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::self-test failed (grep rc=$rc) — DOCS_DENY_PATTERN did not match its probe, or is not a usable pattern; the gate is not firing"; exit 1; }

          # Self-test B — the COMBINED pattern: proves the alternation is still
          # a usable ERE once joined, and that the repo-local half fires too.
          printf '%s\n' '/opt/mythical' | grep -aiqE -e "$FULL" && rc=0 || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::self-test failed (grep rc=$rc) — combined pattern did not match its repo-local probe"; exit 1; }

          # -a, never -I. One NUL byte makes a file invisible to a bare grep,
          # and -I (what this step used before) skips such a file outright — a
          # silent pass on the one file most worth reading. -e guards a pattern
          # that begins with a dash from being parsed as an option.
          #
          # grep's exit code is THREE-valued: 0 = matched, 1 = no match, >=2 =
          # the scan itself failed. A bare `if grep ...; then` folds >=2 into
          # the no-match branch and reports a clean tree it never finished
          # reading — a green build with no scan behind it. Capture the code and
          # treat anything above 1 as a hard failure, as docs-bar.yml does.
          # PASS 1 — the combined pattern, with .github excluded so the
          # repo-local EXTRAS spelled out in this very file cannot match it.
          hits="$(grep -rlaiE -e "$FULL" . \
              --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules)" && rc=0 || rc=$?
          [ "$rc" -le 1 ] || { echo "::error::tree scan failed (grep rc=$rc) — the tree was NOT fully scanned"; exit 1; }
          if [ -n "$hits" ]; then
            # A path is printed, never the matched line. Workflow commands are
            # suppressed around it with a per-use random token: a file whose NAME
            # contains a newline followed by "::" would otherwise inject a command
            # into the log. Log integrity only -- the build is already failing.
            tok="stop-$RANDOM$RANDOM"
            echo "::stop-commands::$tok"
            printf '%s\n' "$hits"
            echo "::${tok}::"
            echo "::error::banned internal term(s) found — see file(s) listed above"
            exit 1
          fi

          # PASS 2 — the SECRET half over the WHOLE tree, .github INCLUDED.
          # The exclusion above exists only for the inline EXTRAS; the secret's
          # terms are not written anywhere in this repository any more, so there
          # is nothing for them to self-match and no reason to skip a directory.
          # This matters more than it looks: --exclude-dir skips that directory
          # NAME AT EVERY DEPTH, so pass 1 alone is blind to a nested path such
          # as docs/.github/ as well as to the root one. After this pass the
          # private terms have no blind spot left anywhere in the tree. Only the
          # repo-local EXTRAS stay unchecked inside a .github directory, and
          # they are written inline precisely because they disclose nothing.
          ghits="$(grep -rlaiE -e "$DENY" . \
              --exclude-dir=.git --exclude-dir=node_modules)" && rc=0 || rc=$?
          [ "$rc" -le 1 ] || { echo "::error::whole-tree scan failed (grep rc=$rc) — NOT fully scanned"; exit 1; }
          if [ -n "$ghits" ]; then
            # A path is printed, never the matched line. Workflow commands are
            # suppressed around it with a per-use random token: a file whose NAME
            # contains a newline followed by "::" would otherwise inject a command
            # into the log. Log integrity only -- the build is already failing.
            tok="stop-$RANDOM$RANDOM"
            echo "::stop-commands::$tok"
            printf '%s\n' "$ghits"
            echo "::${tok}::"
            echo "::error::banned internal term(s) found — see file(s) listed above"
            exit 1
          fi

          # Accepted residual (availability only, never a bypass): with -a, a
          # long base64 data-URI payload or a binary asset (this repo ships
          # .woff2 fonts and .png logos) can in principle match by chance. The
          # secret half already carries that risk in docs-bar.yml, which strips
          # payloads before re-testing. The EXTRAS add ~nothing: '/opt/mythical'
          # is 13 base64-alphabet characters (~1e-19 per offset) and every other
          # extra contains '-', '.' or ':', which cannot occur inside a base64
          # payload at all. A chance hit fails the build and names the file.
          echo "genericize gate: clean"

      # The community-health files must be PHYSICAL files in this repo: org-level
      # defaults do not ship in a clone, a tarball, or a package. Losing one is
      # silent — GitHub's community profile counts the org default and shows
      # green while a downstream consumer gets nothing.
      - name: Repo-local health files present
        run: |
          set -euo pipefail
          missing=0
          for f in LICENSE NOTICE TRADEMARK.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md SUPPORT.md \
                   .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE/config.yml; do
            if [ -f "$f" ]; then echo "  ok   $f"; else echo "  MISS $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "::error::repo-local health file(s) missing"; exit 1; }

      # Reverting an action to a tag re-opens the supply chain the pins closed.
      # The pattern is anchored to a real YAML key and splits the keyword with a
      # bracket class, so this step cannot match the pattern string in its own
      # source — an unanchored grep here fails the build on itself.
      - name: Actions are SHA-pinned
        run: |
          set -euo pipefail
          unpinned=$(grep -rhoE '^[[:space:]]*-?[[:space:]]*us[e]s:[[:space:]]*[^[:space:]]+' \
                       .github/workflows/ | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::action(s) not pinned to a full commit SHA:"; echo "$unpinned"; exit 1
          fi
          echo "action pinning: clean"
