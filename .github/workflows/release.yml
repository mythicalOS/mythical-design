name: Release

# Publishes @mythicalos/tokens to npm WITH provenance attestation, via OIDC
# Trusted Publishing — no stored token. Configure the trusted publisher on
# npmjs.com (Settings -> package -> Trusted Publisher):
#   repository = mythicalOS/mythical-design, workflow = release.yml
#
# @mythicalos/tokens is a files-only package (tokens.css, assets, docs) — no
# build, no dependencies to resolve.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write            # required for OIDC trusted publishing + provenance

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node + npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node, checked 2026-09-09 against endoflife.date: 24 is the ACTIVE LTS
          # — active support to 2026-10-20, security support to 2028-04-30. The 22
          # line is maintenance-only and goes end-of-life 2027-04-30. Node runs
          # nothing but npm in this workflow; the package is files-only.
          # Re-check the lifecycle before changing this pin; never write a version from memory.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing / provenance needs npm >= 11.5.1; ubuntu-latest ships 10.x.
      - name: Upgrade npm to a trusted-publishing-capable version
        run: npm install -g npm@latest && npm --version

      - name: Publish with provenance (skip if version already on the registry)
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "already published: ${name}@${version} — nothing to do"
            exit 0
          fi
          echo "publishing ${name}@${version} (with provenance)"
          npm publish --provenance --access public
